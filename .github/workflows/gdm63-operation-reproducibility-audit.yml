        uses: actions/upload-artifact@v4
        with:
          name: gdm63-operation-attempt1-batch-${{ github.run_id }}
          path: audit-output/ATTEMPT1_OPERATION_BATCH_REPORT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload attempt 2 operation BATCH_REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:

name: GDM18 Rover smoke
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm18/rover_smoke.py
      - .github/workflows/gdm18-rover-smoke.yml
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rover
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          echo "$HOME/.rover/bin" >> "$GITHUB_PATH"
      - name: Compose
        env:
          APOLLO_TELEMETRY_DISABLED: "true"\n          APOLLO_ELV2_LICENSE: "accept"
        run: python experiments/gdm18/rover_smoke.py

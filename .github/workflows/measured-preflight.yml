name: Measured repair preflight
on:
  push:
    branches: [main]
    paths:
      - experiments/measured/contracts.py
      - experiments/measured/test_contracts.py
      - .github/workflows/measured-preflight.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: measured-preflight-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test contracts in Actions
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pip install graphql-core==3.2.6
          python -m compileall -q experiments/measured
          python -m unittest experiments.measured.test_contracts -v 2>&1 | tee artifacts/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-preflight-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

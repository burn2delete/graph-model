name: GDM34 recursive Graph IR
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm34/**
      - .github/workflows/gdm34.yml
  workflow_dispatch: {}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          cd experiments/gdm34
          python recursive_ir.py | tee gdm34.log
      - uses: actions/upload-artifact@v4
        with:
          name: gdm34-results
          path: |
            experiments/gdm34/artifacts/gdm34.json
            experiments/gdm34/gdm34.log
          if-no-files-found: error

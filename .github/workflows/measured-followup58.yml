name: GDM58 broader top-k ambiguity evidence
on:
  push:
    branches: [main]
    paths:
      - experiments/followup58/**
      - .github/workflows/measured-followup58.yml
  workflow_dispatch:
    inputs:
      seeds:
        default: '5801,5802'
        type: string
permissions:
  contents: read
concurrency:
  group: graph-model-gdm58-measured
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  APOLLO_ELV2_LICENSE: accept
  APOLLO_TELEMETRY_DISABLED: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_DYNAMIC: 'FALSE'
  MKL_CBWR: COMPATIBLE
  ATEN_CPU_CAPABILITY: default
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  SEEDS: ${{ inputs.seeds || '5801,5802' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies and Rover
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile and test GDM58 top-k evidence and inherited contracts
        run: |
          set -euo pipefail
          python -m compileall -q experiments/followup58
          python -m unittest experiments.followup58.test_followup experiments.followup57.test_followup experiments.followup56.test_followup experiments.followup55.test_followup experiments.followup54.test_followup experiments.followup53.test_followup experiments.followup52.test_followup experiments.followup51.test_followup experiments.followup50.test_cache_repair -v 2>&1 | tee artifacts/tests.log
      - name: Train and independently verify all-candidate pooled smoke policy
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true python -m experiments.followup58.execute --backbone hash --task operation --arms all-pooled --seeds 5801 --epochs 2 --output artifacts/smoke 2>&1 | tee artifacts/smoke.log
          python - <<'PY'
          from pathlib import Path
          import json
          from experiments.followup58.collect import verify_summary

          summaries=list(Path('artifacts/smoke').rglob('summary.json'))
          assert len(summaries)==1, summaries
          summary=verify_summary(summaries[0])[0]
          h=summary['encoder']['head_training_reproducibility']
          assert h['adamw_foreach'] is False and h['adamw_fused'] is False
          assert h['clip_grad_norm_foreach'] is False
          assert h['moment_update_dtype']=='float32'
          assert h['final_parameter_application_dtype']=='float64->float32'
          assert h['stored_parameter_dtype']=='float32'
          assert h['feature_quantum_unchanged']==1e-4
          assert h['gdm58_execution_scope']=='capability_and_ambiguity_heads'
          assert h['canonical_gdm57_source_commit']=='3f8b9a968285110ca6c744590724ddd0cb2bd5aa'
          assert h['gdm58_change_scope']=='ambiguity-head top-k semantic evidence breadth only; fixed canonical GDM56 family-balanced curriculum, canonical numerical path and GDM54 5pp rescue arbitration'
          tr=summary['training']
          assert tr['gdm58_representation_mode']=='all-pooled'
          assert tr['gdm58_requested_topk']=='all'
          assert tr['gdm58_ambiguity_feature_dim']==1291
          assert tr['gdm58_pooling_order_invariant'] is True
          assert 'weighted-mean' in tr['gdm58_semantic_pooling']
          assert tr['gdm56_ambiguity_curriculum']=='family-balanced'
          families=tr['gdm56_positive_family_counts']
          assert set(families)=={'role','lifecycle-time','representation','object-vs-supplier'}
          assert max(families.values())-min(families.values()) <= 1
          assert tr['gdm56_counterfactual_negative_fraction']==0.0
          cal=json.loads((summaries[0].parent/'calibration.json').read_text())['selected']
          assert cal['threshold_selection']=='ambiguity-rescue'
          assert cal['status_arbitration']=='ambiguity-rescue'
          assert cal['nomatch_recall_budget_pp']==5
          assert cal['nomatch_recall_floor'] <= cal['joint_baseline_validation_metrics']['nomatch_recall']
          assert cal['accepted_status_recall_floor'] <= cal['joint_baseline_validation_metrics']['accepted_status_recall']
          holdout=summary['secondary_holdout_ambiguity_family_metrics']
          assert set(holdout)=={'role','lifecycle-time','representation','object-vs-supplier'}
          print('gdm58 deterministic smoke evidence, matched-capacity top-k pooling and fixed curriculum/arbitration contract verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm58-preflight-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  experiments:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [operation, schema]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: gdm57-hf-${{ runner.os }}-distilbert-v1
      - name: Install CPU model dependencies and Rover
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip freeze > artifacts/packages.txt
      - name: Train top-k ambiguity evidence, execute GraphQL, compose schemas, and measure
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true python -m experiments.followup58.execute --backbone distilbert --task "$TASK" --seeds "$SEEDS" --epochs 12 --output artifacts/results 2>&1 | tee artifacts/run.log
          test -s artifacts/results/worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm58-worker-${{ github.run_id }}-${{ matrix.task }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 3
  verify-batch:
    needs: [preflight, experiments]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: gdm58-worker-${{ github.run_id }}-*
          path: collected
      - name: Independently verify GDM58 evidence and reproduce metrics
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m experiments.followup58.collect collected --seeds "$SEEDS" 2>&1 | tee collection.log
          test -s collected/BATCH_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm58-batch-report-${{ github.run_id }}
          path: |
            collected/BATCH_REPORT.json
            collection.log
          if-no-files-found: error
          retention-days: 14

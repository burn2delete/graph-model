name: GDM50 exact-attempt reproducibility audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/gdm50-reproducibility-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: graph-model-gdm50-measured
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN: '35680386718'
      SOURCE_SHA: 62d2720800f5d98e1521e0200766a80e998ebe9b
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ATEN_CPU_CAPABILITY: default
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62d2720800f5d98e1521e0200766a80e998ebe9b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-verifier dependencies
        run: |
          set -euo pipefail
          mkdir -p audit-output
          command -v gh
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m pip freeze > audit-output/packages.txt
      - name: Verify isolated attempt artifacts and compare all twenty configurations
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee audit-output/audit.log
          import copy, hashlib, json, math, os, stat, subprocess, traceback, zipfile
          from pathlib import Path, PurePosixPath
          import torch
          from experiments.followup50.collect import verify_summary
          from experiments.followup50.run import ARMS
          from experiments.measured.models import state_hash

          REPO='burn2delete/graph-model'
          RUN=int(os.environ['SOURCE_RUN'])
          SHA=os.environ['SOURCE_SHA']
          OUTPUT=Path('audit-output')
          ROOT=Path('isolated-evidence')
          FIRST_IDS={'report':10674828531,'operation':10675321280,'schema':10674723569,'preflight':10674577516}
          FIRST_DIGESTS={
            'report':'sha256:5af06cc91e1b3e36b19a6f5cbd3e0cd7b66047dd100e6a8cfb1b7cdbe1358c20',
            'operation':'sha256:758b30fd4581372500710b8d7817de14d1de463788d8aa06df438ad48cb0bbb2',
            'schema':'sha256:93ddb8d9bef4cc96dfb1760bc1d0f3e474feb800613892a46ab5b14d468c3cac',
            'preflight':'sha256:c63efbb968d1f9ec6bbb1cbb4b83930e2ad71ae7d54800aad663211bf8f0469d',
          }
          report={'format':'gdm50-reproducibility-audit-v2','source_run':RUN,'source_commit':SHA,
                  'audit_run':os.environ['GITHUB_RUN_ID'],'audit_workflow_commit':os.environ['GITHUB_SHA'],
                  'source_attempts':[1,2],'complete':False,'evidence_verified':False,'reproducible':False,
                  'promotion_eligible':False,'provenance':{},'comparisons':[],'errors':[],
                  'scope':'evidence verification only; no model training or architecture batch'}

          def write_report():
              (OUTPUT/'REPRODUCIBILITY_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          def require(c,m):
              if not c: raise AssertionError(m)
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{REPO}/{path}']))
          def all_items(path,field):
              out=[]; page=1
              while True:
                  sep='&' if '?' in path else '?'
                  doc=api(f'{path}{sep}per_page=100&page={page}')
                  batch=doc[field]; out.extend(batch)
                  if len(batch)<100:
                      require(len(out)==doc['total_count'],'incomplete pagination '+path)
                      return out
                  page+=1
          def fhash(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          def download(artifact,dst):
              dst.mkdir(parents=True,exist_ok=False); zpath=dst.with_suffix('.zip')
              with zpath.open('wb') as f:
                  subprocess.run(['gh','api',f'repos/{REPO}/actions/artifacts/{artifact["id"]}/zip'],stdout=f,check=True)
              require('sha256:'+fhash(zpath)==artifact['digest'],'archive digest mismatch')
              with zipfile.ZipFile(zpath) as z:
                  require(sum(i.file_size for i in z.infolist())<1024**3,'oversized archive')
                  for i in z.infolist():
                      p=PurePosixPath(i.filename)
                      require(not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename,'unsafe archive path')
                      require(not stat.S_ISLNK(i.external_attr>>16),'archive symlink rejected')
                  z.extractall(dst)
          def load(path): return json.loads(path.read_text())
          def one(root,name):
              p=list(root.rglob(name)); require(len(p)==1,f'expected one {name}: {p}'); return p[0]
          def evidence_flags(doc):
              require(doc.get('source_commit')==SHA,'report source commit mismatch')
              require(doc.get('complete') is True and doc.get('verified') is True,'source report not verified')
              require(doc.get('expected_results')==20 and doc.get('verified_results')==20,'source report not 20/20')
              for k in ('missing_results','failed_results','unexpected_results'): require(doc.get(k)==[],f'source report has {k}')
          def normalized_batch(doc):
              d=copy.deepcopy(doc)
              for g in d['aggregates']:
                  g['semantic_confusions']=sorted(g['semantic_confusions'],key=lambda c:(c['reference'],c['predicted'],c['count']))
              return d
          def deterministic_rows(path):
              out={}
              for line in path.read_text().splitlines():
                  if not line.strip(): continue
                  r=json.loads(line); uid=r['id']; require(uid not in out,'duplicate prediction ID')
                  comp=r.get('judgment',{}).get('composition')
                  if isinstance(comp,dict): comp.pop('elapsed_ms',None)
                  out[uid]=r
              return out
          def head_contract(h):
              require(h.get('adamw_foreach') is False and h.get('adamw_fused') is False,'AdamW path contract missing')
              require(h.get('clip_grad_norm_foreach') is False,'clip path contract missing')
              require(h.get('moment_update_dtype')=='float32','moment dtype contract missing')
              require(h.get('final_parameter_application_dtype')=='float64->float32','parameter application dtype contract missing')
              require(h.get('stored_parameter_dtype')=='float32','stored dtype contract missing')
              require(h.get('feature_quantum_unchanged')==1e-4,'feature quantum contract missing')
              require(h.get('numerical_architecture_change') is True,'numerical architecture change not recorded')
              require(h.get('model_objective_changed') is False,'model objective changed unexpectedly')
              require(h.get('verified_denominator_drift_diagnostic_run')==35677485996,'denominator diagnostic provenance missing')
              require(h.get('verified_full_epoch_candidate_run')==35677710836,'epoch diagnostic provenance missing')
              require(h.get('verified_full_epoch_checkpoint_sequences_exact_match') is True,'epoch checkpoint evidence missing')
              require(h.get('verified_full_epoch_final_capability_exact_match') is True,'epoch final hash evidence missing')
          def snapshot(s,d):
              tr=s['training']; e=s['encoder']
              return {'config':s['config'],'seed':s['seed'],'source_commit':s['source_commit'],
                'dataset_sha256':s['dataset_sha256'],'calibration_only_sha256':s['calibration_only_sha256'],
                'secondary_holdout_sha256':s['secondary_holdout_sha256'],'model_revision':e['revision'],'pooling':e['pooling'],
                'feature_canonicalization':e['feature_canonicalization'],'cpu_reproducibility':e['cpu_reproducibility'],
                'head_training_reproducibility':e['head_training_reproducibility'],
                'initial_state_hash':tr['initial_state_hash'],'initial_capability_hash':tr['initial_capability_hash'],
                'selected_state_hash':tr['selected_state_hash'],'selected_capability_hash':tr['selected_capability_hash'],
                'selected_epoch':tr['selected_epoch'],'optimizer_updates':tr['optimizer_updates'],
                'selected_capability_optimizer_updates':tr['selected_capability_optimizer_updates'],
                'calibration':load(d/'calibration.json'),'training_record':load(d/'training.json'),
                'regression_metrics':s['regression_metrics'],'secondary_holdout_metrics':s['secondary_holdout_metrics'],
                'regression_clause_metrics':s['regression_clause_metrics'],'secondary_holdout_clause_metrics':s['secondary_holdout_clause_metrics'],
                'probe_texts_sha256':e['reproducibility_probe']['texts_sha256'],
                'canonical_probe_sha256':e['reproducibility_probe']['canonical_feature_sha256'],
                'corpus_unique_texts':e['feature_corpus']['unique_texts'],
                'canonical_corpus_sha256':e['feature_corpus']['canonical_text_feature_sha256'],
                'latency_scope':s['latency_scope']}

          write_report()
          try:
              require(os.environ.get('GITHUB_ACTIONS')=='true','Actions execution required')
              require(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==SHA,'wrong verifier checkout')
              current=api(f'actions/runs/{RUN}')
              require(current['status']=='completed' and current['conclusion']=='success' and current['run_attempt']==2,'source attempt 2 not complete/success')
              artifacts=all_items(f'actions/runs/{RUN}/artifacts','artifacts')
              expected={(t,a,s) for t in ('operation','schema') for a in ARMS for s in (5001,5002)}
              attempts={}; used=set()
              for attempt in (1,2):
                  meta=api(f'actions/runs/{RUN}/attempts/{attempt}')
                  require(meta['head_sha']==SHA and meta['run_attempt']==attempt and meta['status']=='completed' and meta['conclusion']=='success','attempt metadata mismatch')
                  jobs=all_items(f'actions/runs/{RUN}/attempts/{attempt}/jobs','jobs'); by={j['name']:j for j in jobs}
                  wanted={'preflight':'preflight','operation':'experiments (operation)','schema':'experiments (schema)','report':'verify-batch'}
                  require(set(by)==set(wanted.values()),'unexpected/missing source jobs')
                  prov={'attempt':meta,'jobs':jobs,'artifacts':{}}; report['provenance'][str(attempt)]=prov
                  for role,jname in wanted.items():
                      j=by[jname]; require(j['run_attempt']==attempt and j['conclusion']=='success','wrong/failed job attempt')
                      name=(f'gdm50-worker-{RUN}-{role}' if role in ('operation','schema') else f'gdm50-batch-report-{RUN}' if role=='report' else f'gdm50-preflight-{RUN}')
                      cand=[a for a in artifacts if a['name']==name and j['started_at']<=a['created_at']<=j['completed_at']]
                      require(len(cand)==1,f'artifact provenance ambiguous/missing {attempt}/{role}')
                      a=cand[0]; require(not a['expired'] and a['workflow_run']['id']==RUN and a['workflow_run']['head_sha']==SHA,'artifact provenance mismatch')
                      if attempt==1:
                          require(a['id']==FIRST_IDS[role],f'attempt1 {role} ID changed')
                          require(a['digest']==FIRST_DIGESTS[role],f'attempt1 {role} digest changed')
                      require(a['id'] not in used,'artifact reused across attempts'); used.add(a['id']); prov['artifacts'][role]=a; write_report()
                      target=ROOT/str(attempt)/('workers' if role in ('operation','schema') else 'other')/role; download(a,target)
                  original=load(one(ROOT/str(attempt)/'other'/'report','BATCH_REPORT.json')); evidence_flags(original)
                  tests=one(ROOT/str(attempt)/'other'/'preflight','tests.log').read_text(); require('Ran 10 tests' in tests and '\nOK' in tests,'preflight contract/cache tests missing')
                  workers=ROOT/str(attempt)/'workers'; env=dict(os.environ,GITHUB_SHA=SHA)
                  with (OUTPUT/f'collector-attempt-{attempt}.log').open('w') as log:
                      subprocess.run(['python','-m','experiments.followup50.collect',str(workers),'--seeds','5001,5002'],env=env,stdout=log,stderr=subprocess.STDOUT,check=True)
                  rebuilt=load(workers/'BATCH_REPORT.json'); evidence_flags(rebuilt)
                  require(normalized_batch(original)==normalized_batch(rebuilt),'source BATCH_REPORT does not match isolated reconstruction')
                  (OUTPUT/f'BATCH_REPORT-attempt-{attempt}.json').write_text(json.dumps(original,indent=2)+'\n')
                  entries={}
                  for p in workers.rglob('summary.json'):
                      s,_=verify_summary(p); key=(s['config']['task'],s['config']['arm'],s['seed'])
                      require(key in expected and key not in entries,'duplicate/unexpected result')
                      require(s['source_commit']==SHA and str(s['run_id'])==str(RUN),'summary provenance mismatch')
                      require(s['encoder']['feature_canonicalization']['quantum']==1e-4,'frozen feature quantum changed')
                      require(s['encoder']['feature_corpus']['unique_texts']>0,'empty feature corpus'); head_contract(s['encoder']['head_training_reproducibility'])
                      for phase in ('initial','selected'):
                          st=torch.load(p.parent/f'{phase}.pt',map_location='cpu',weights_only=True)['state']
                          cap={k.removeprefix('capability.'):v for k,v in st.items() if k.startswith('capability.')}
                          require(cap and state_hash(cap)==s['training'][f'{phase}_capability_hash'],'checkpoint capability hash mismatch')
                      tm=load(p.parent/'timings.json')
                      require(len(tm['generation_ms'])==24 and tm['warmup_requests']==2 and tm['encoder_calls_measured']>0 and 'cached catalog' in tm['scope'],'invalid cached-catalog timing contract')
                      require(all(math.isfinite(v) and v>0 for v in tm['generation_ms']),'invalid timing sample')
                      require(s['regression_examples']==278 and s['secondary_holdout_examples']==76,'example counts changed')
                      entries[key]=(s,p.parent)
                  require(set(entries)==expected,'not exactly twenty verified configurations'); attempts[attempt]=entries
              report['evidence_verified']=True
              for key in sorted(expected):
                  a,ad=attempts[1][key]; b,bd=attempts[2][key]; sa,sb=snapshot(a,ad),snapshot(b,bd)
                  diffs=[f for f in sa if sa[f]!=sb[f]]; pred_diffs={}
                  for split in ('regression','holdout'):
                      ar=deterministic_rows(ad/f'predictions-{split}.jsonl'); br=deterministic_rows(bd/f'predictions-{split}.jsonl')
                      changed=sorted(uid for uid in ar.keys()|br.keys() if ar.get(uid)!=br.get(uid)); pred_diffs[split]=changed
                      if changed: diffs.append(f'predictions-{split}')
                  raw={'probe':a['encoder']['reproducibility_probe']['raw_feature_sha256']==b['encoder']['reproducibility_probe']['raw_feature_sha256'],
                       'corpus':a['encoder']['feature_corpus']['raw_text_feature_sha256']==b['encoder']['feature_corpus']['raw_text_feature_sha256']}
                  report['comparisons'].append({'task':key[0],'arm':key[1],'seed':key[2],'match':not diffs,'differing_fields':diffs,
                    'attempt_1':sa,'attempt_2':sb,'raw_features_match':raw,'prediction_difference_ids':pred_diffs,
                    'timing_attempt_1':a['generation_latency'],'timing_attempt_2':b['generation_latency'],
                    'memory_attempt_1':a['memory'],'memory_attempt_2':b['memory']})
              report['tasks']={t:{'expected':10,'matched':sum(c['match'] for c in report['comparisons'] if c['task']==t)} for t in ('operation','schema')}
              report['complete']=True; report['reproducible']=all(c['match'] for c in report['comparisons']); report['promotion_eligible']=report['evidence_verified'] and report['reproducible']; write_report()
              print(json.dumps({k:report[k] for k in ('complete','evidence_verified','reproducible','promotion_eligible','tasks')},indent=2))
              if not report['promotion_eligible']: raise SystemExit(1)
          except Exception as exc:
              report['errors'].append({'type':type(exc).__name__,'message':str(exc)}); write_report(); traceback.print_exc(); raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm50-reproducibility-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

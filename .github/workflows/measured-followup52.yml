name: GDM52 status-specific ambiguity calibration
on:
  push:
    branches: [main]
    paths:
      - experiments/followup52/**
      - .github/workflows/measured-followup52.yml
  workflow_dispatch:
    inputs:
      seeds:
        default: '5201,5202'
        type: string
permissions:
  contents: read
concurrency:
  group: graph-model-gdm52-measured
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  APOLLO_ELV2_LICENSE: accept
  APOLLO_TELEMETRY_DISABLED: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OMP_DYNAMIC: 'FALSE'
  MKL_DYNAMIC: 'FALSE'
  MKL_CBWR: COMPATIBLE
  ATEN_CPU_CAPABILITY: default
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'
  SEEDS: ${{ inputs.seeds || '5201,5202' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies and Rover
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile and test GDM52 contracts and inherited numerical/cache boundaries
        run: |
          set -euo pipefail
          python -m compileall -q experiments/followup52
          python -m unittest experiments.followup52.test_followup experiments.followup51.test_followup experiments.followup50.test_cache_repair -v 2>&1 | tee artifacts/tests.log
      - name: Train and independently verify status-specific calibration smoke policy
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true python - --backbone hash --task operation --arms sequential-structured --seeds 5201 --epochs 2 --output artifacts/smoke --smoke <<'PY' 2>&1 | tee artifacts/smoke.log
          import torch
          from experiments.followup50 import execute as g50exec
          from experiments.followup50 import execute_deterministic as g50det
          from experiments.followup52 import run as g52

          SOURCE50='62d2720800f5d98e1521e0200766a80e998ebe9b'
          SOURCE51='f52baf82222947ca00139437e90fe9b5428bd9ae'
          g50exec.configure_reproducibility()

          class Encoder(g50det.ReproducibleEncoder):
              def __init__(self,*a,**k):
                  super().__init__(*a,**k)
                  h=dict(self.meta['head_training_reproducibility'])
                  h['gdm52_execution_scope']='capability_and_ambiguity_heads'
                  h['canonical_gdm50_numerical_source_commit']=SOURCE50
                  h['canonical_gdm51_architecture_source_commit']=SOURCE51
                  h['gdm52_change_scope']='validation-only status-specific threshold calibration'
                  self.meta=dict(self.meta)
                  self.meta['head_training_reproducibility']=h

          old_adamw=torch.optim.AdamW
          old_clip=torch.nn.utils.clip_grad_norm_
          old_enc=g52.Encoder
          old_nt=torch.set_num_threads
          old_ni=torch.set_num_interop_threads
          torch.optim.AdamW=g50det.HighPrecisionParameterApplyAdamW
          torch.nn.utils.clip_grad_norm_=g50det.single_tensor_clip_grad_norm_
          g52.Encoder=Encoder
          torch.set_num_threads=lambda _n: old_nt(1)
          def interop(_n):
              if torch.get_num_interop_threads()!=1:
                  raise RuntimeError('GDM52 reproducibility contract requires one inter-op thread')
          torch.set_num_interop_threads=interop
          try:
              g52.main()
          finally:
              torch.optim.AdamW=old_adamw
              torch.nn.utils.clip_grad_norm_=old_clip
              g52.Encoder=old_enc
              torch.set_num_threads=old_nt
              torch.set_num_interop_threads=old_ni
          PY
          python - <<'PY'
          from pathlib import Path
          import json
          from experiments.followup52.collect import verify_summary

          summaries=list(Path('artifacts/smoke').rglob('summary.json'))
          assert len(summaries)==1, summaries
          summary=verify_summary(summaries[0])[0]
          h=summary['encoder']['head_training_reproducibility']
          assert h['adamw_foreach'] is False and h['adamw_fused'] is False
          assert h['clip_grad_norm_foreach'] is False
          assert h['moment_update_dtype']=='float32'
          assert h['final_parameter_application_dtype']=='float64->float32'
          assert h['stored_parameter_dtype']=='float32'
          assert h['feature_quantum_unchanged']==1e-4
          assert h['numerical_architecture_change'] is True and h['model_objective_changed'] is False
          assert h['gdm52_execution_scope']=='capability_and_ambiguity_heads'
          assert h['canonical_gdm50_numerical_source_commit']=='62d2720800f5d98e1521e0200766a80e998ebe9b'
          assert h['canonical_gdm51_architecture_source_commit']=='f52baf82222947ca00139437e90fe9b5428bd9ae'
          assert h['gdm52_change_scope']=='validation-only status-specific threshold calibration'
          cal=json.loads((summaries[0].parent/'calibration.json').read_text())['selected']
          assert cal['threshold_selection']=='sequential-status-specific'
          assert isinstance(cal['none_gate_validation_metrics'],dict)
          assert isinstance(cal['ambiguity_gate_validation_metrics'],dict)
          print('gdm52 deterministic smoke evidence and calibration contract verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm52-preflight-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  experiments:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [operation, schema]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: gdm52-hf-${{ runner.os }}-distilbert-v1
      - name: Install CPU model dependencies and Rover
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip freeze > artifacts/packages.txt
      - name: Train paired ambiguity heads, calibrate status gates, execute GraphQL, compose schemas, and measure
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          GITHUB_ACTIONS=true python - --backbone distilbert --task "$TASK" --seeds "$SEEDS" --epochs 12 --output artifacts/results <<'PY' 2>&1 | tee artifacts/run.log
          import torch
          from experiments.followup50 import execute as g50exec
          from experiments.followup50 import execute_deterministic as g50det
          from experiments.followup52 import run as g52

          SOURCE50='62d2720800f5d98e1521e0200766a80e998ebe9b'
          SOURCE51='f52baf82222947ca00139437e90fe9b5428bd9ae'
          g50exec.configure_reproducibility()

          class Encoder(g50det.ReproducibleEncoder):
              def __init__(self,*a,**k):
                  super().__init__(*a,**k)
                  h=dict(self.meta['head_training_reproducibility'])
                  h['gdm52_execution_scope']='capability_and_ambiguity_heads'
                  h['canonical_gdm50_numerical_source_commit']=SOURCE50
                  h['canonical_gdm51_architecture_source_commit']=SOURCE51
                  h['gdm52_change_scope']='validation-only status-specific threshold calibration'
                  self.meta=dict(self.meta)
                  self.meta['head_training_reproducibility']=h

          old_adamw=torch.optim.AdamW
          old_clip=torch.nn.utils.clip_grad_norm_
          old_enc=g52.Encoder
          old_nt=torch.set_num_threads
          old_ni=torch.set_num_interop_threads
          torch.optim.AdamW=g50det.HighPrecisionParameterApplyAdamW
          torch.nn.utils.clip_grad_norm_=g50det.single_tensor_clip_grad_norm_
          g52.Encoder=Encoder
          torch.set_num_threads=lambda _n: old_nt(1)
          def interop(_n):
              if torch.get_num_interop_threads()!=1:
                  raise RuntimeError('GDM52 reproducibility contract requires one inter-op thread')
          torch.set_num_interop_threads=interop
          try:
              g52.main()
          finally:
              torch.optim.AdamW=old_adamw
              torch.nn.utils.clip_grad_norm_=old_clip
              g52.Encoder=old_enc
              torch.set_num_threads=old_nt
              torch.set_num_interop_threads=old_ni
          PY
          test -s artifacts/results/worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm52-worker-${{ github.run_id }}-${{ matrix.task }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 3
  verify-batch:
    needs: [preflight, experiments]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: gdm52-worker-${{ github.run_id }}-*
          path: collected
      - name: Independently verify GDM52 evidence and reproduce metrics
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m experiments.followup52.collect collected --seeds "$SEEDS" 2>&1 | tee collection.log
          test -s collected/BATCH_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm52-batch-report-${{ github.run_id }}
          path: |
            collected/BATCH_REPORT.json
            collection.log
          if-no-files-found: error
          retention-days: 14

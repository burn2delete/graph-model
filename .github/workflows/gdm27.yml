name: GDM27 pairwise option head
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm27/**
      - .github/workflows/gdm27.yml
  workflow_dispatch: {}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install torch transformers
      - run: |
          cd experiments/gdm27
          python pairwise_option_head.py | tee gdm27.log
      - uses: actions/upload-artifact@v4
        with:
          name: gdm27-results
          path: |
            experiments/gdm27/artifacts/gdm27.json
            experiments/gdm27/gdm27.log
          if-no-files-found: error

name: GDM45 measured clause decomposition
on:
  push:
    branches: [main]
    paths:
      - experiments/followup45/**
      - .github/workflows/measured-followup45.yml
  workflow_dispatch:
    inputs:
      seeds:
        default: '4501,4502'
        type: string
permissions:
  contents: read
concurrency:
  group: graph-model-gdm45-measured
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  APOLLO_ELV2_LICENSE: accept
  APOLLO_TELEMETRY_DISABLED: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
  SEEDS: ${{ inputs.seeds || '4501,4502' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          sha256sum /tmp/rover.tar.gz > artifacts/rover-archive.sha256
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile and test contracts
        run: |
          set -euo pipefail
          python -m compileall -q experiments/followup45
          python -m unittest experiments.followup45.test_followup -v 2>&1 | tee artifacts/tests.log
      - name: Train and verify an actual smoke feature policy
        run: |
          set -euo pipefail
          python -m experiments.followup45.entry --backbone hash --task operation --arms clause-risk --seeds 4501 --epochs 2 --output artifacts/smoke --smoke 2>&1 | tee artifacts/smoke.log
          python - <<'PY'
          from pathlib import Path
          from experiments.followup45.collect import verify_summary
          summaries = list(Path('artifacts/smoke').rglob('summary.json'))
          assert len(summaries) == 1, summaries
          verify_summary(summaries[0])
          print('smoke evidence verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm45-preflight-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  experiments:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        backbone: [distilbert, mmbert]
        task: [operation, schema]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: gdm45-hf-${{ runner.os }}-${{ matrix.backbone }}-v1
      - name: Install CPU model dependencies and Rover
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip freeze > artifacts/packages.txt
      - name: Train, execute GraphQL, compose schemas and measure every arm
        env:
          BACKBONE: ${{ matrix.backbone }}
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          python -m experiments.followup45.entry --backbone "$BACKBONE" --task "$TASK" --seeds "$SEEDS" --epochs 10 --output artifacts/results 2>&1 | tee artifacts/run.log
          test -s artifacts/results/worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm45-worker-${{ github.run_id }}-${{ matrix.backbone }}-${{ matrix.task }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 3
  verify-batch:
    needs: [preflight, experiments]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: gdm45-worker-${{ github.run_id }}-*
          path: collected
      - name: Independently verify checkpoints, predictions, GraphQL evidence and timings
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m experiments.followup45.collect collected --seeds "$SEEDS" 2>&1 | tee collection.log
          test -s collected/BATCH_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdm45-batch-report-${{ github.run_id }}
          path: |
            collected/BATCH_REPORT.json
            collection.log
          if-no-files-found: error
          retention-days: 14

name: GDM29 typed catalog integration
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm29/**
      - .github/workflows/gdm29.yml
  workflow_dispatch: {}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install torch transformers
      - run: |
          cd experiments/gdm29
          python catalog_typed_integration.py | tee gdm29.log
      - uses: actions/upload-artifact@v4
        with:
          name: gdm29-results
          path: |
            experiments/gdm29/artifacts/gdm29.json
            experiments/gdm29/gdm29.log
          if-no-files-found: error

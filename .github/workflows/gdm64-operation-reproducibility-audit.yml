name: GDM64 operation-only exact-attempt reproducibility audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/gdm64-operation-reproducibility-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: graph-model-gdm64-operation-audit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_RUN: '35995968508'
      SOURCE_SHA: 6fe0f89630324fa18c18175c1d7c64ba614a1cff
      AUDIT_DRIVER_REPAIR: 39b97e44a822c1a6d31812af88fb8ae62b2885c7
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: COMPATIBLE
      ATEN_CPU_CAPABILITY: default
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert measured GDM64 source is unchanged since pinned source commit
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_SHA" -- \
            experiments/followup64/DESIGN.md \
            experiments/followup64/__init__.py \
            experiments/followup64/run.py \
            experiments/followup64/execute.py \
            experiments/followup64/collect.py \
            experiments/followup64/test_followup.py \
            .github/workflows/measured-followup64.yml
      - name: Install source verifier dependencies
        run: |
          set -euo pipefail
          mkdir -p audit-output audit-scratch
          command -v gh
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m pip freeze > audit-output/packages.txt
      - name: Verify GDM64 operation evidence from both exact attempts
        run: |
          set -euo pipefail
          python -u -m experiments.followup64.audit 2>&1 | tee audit-output/audit.log
      - name: Upload attempt 1 operation BATCH_REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdm64-operation-attempt1-batch-${{ github.run_id }}
          path: audit-output/ATTEMPT1_OPERATION_BATCH_REPORT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload attempt 2 operation BATCH_REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdm64-operation-attempt2-batch-${{ github.run_id }}
          path: audit-output/ATTEMPT2_OPERATION_BATCH_REPORT.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload operation reproducibility audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdm64-operation-reproducibility-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

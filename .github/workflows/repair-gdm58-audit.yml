name: Repair GDM58 audit archive-size guard
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-gdm58-audit.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch only the GDM58 audit archive guard
        run: |
          set -euo pipefail
          meta="$(gh api repos/burn2delete/graph-model/contents/.github/workflows/gdm58-reproducibility-audit.yml)"
          sha="$(jq -r .sha <<<"$meta")"
          jq -r .content <<<"$meta" | base64 -d > audit.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('audit.yml')
          text = path.read_text()
          old = "require(sum(item.file_size for item in archive.infolist()) < 2 * 1024**3, 'oversized archive')"
          new = "require(sum(item.file_size for item in archive.infolist()) < 4 * 1024**3, 'oversized archive')"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one archive guard, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          content="$(base64 -w0 audit.yml)"
          gh api --method PUT repos/burn2delete/graph-model/contents/.github/workflows/gdm58-reproducibility-audit.yml \
            -f message='Repair GDM58 audit archive-size guard only' \
            -f content="$content" \
            -f sha="$sha" >/tmp/update.json
          jq -r '.commit.sha' /tmp/update.json

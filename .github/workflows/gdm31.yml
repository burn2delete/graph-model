name: GDM31 SDL curriculum
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm31/**
      - .github/workflows/gdm31.yml
  workflow_dispatch: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          cd experiments/gdm31
          python sdl_curriculum.py | tee gdm31.log
      - uses: actions/upload-artifact@v4
        with:
          name: gdm31-curriculum
          path: |
            experiments/gdm31/artifacts
            experiments/gdm31/gdm31.log
          if-no-files-found: error

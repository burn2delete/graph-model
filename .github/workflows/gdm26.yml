name: GDM26 failure contrasts
on:
  push:
    branches: [main]
    paths:
      - experiments/gdm26/**
      - .github/workflows/gdm26.yml
  workflow_dispatch: {}
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install torch transformers
      - run: |
          cd experiments/gdm26
          python failure_contrasts.py | tee gdm26.log
      - uses: actions/upload-artifact@v4
        with:
          name: gdm26-results
          path: |
            experiments/gdm26/artifacts/gdm26.json
            experiments/gdm26/gdm26.log
          if-no-files-found: error

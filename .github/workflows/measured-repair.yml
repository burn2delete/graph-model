name: Repair GDM41-44 with measured model runs
on:
  push:
    branches: [main]
    paths:
      - experiments/measured/**
      - .github/workflows/measured-repair.yml
  workflow_dispatch:
    inputs:
      batches:
        description: Existing batches to repair
        default: '41,42,43,44'
        type: string
      seeds:
        default: '4101,4102'
        type: string
  workflow_call:
    inputs:
      batches:
        default: '41,42,43,44'
        type: string
      seeds:
        default: '4101,4102'
        type: string
permissions:
  contents: read
concurrency:
  group: graph-model-measured-repair
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  APOLLO_ELV2_LICENSE: accept
  APOLLO_TELEMETRY_DISABLED: 'true'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'
  BATCHES: ${{ inputs.batches || '41,42,43,44' }}
  SEEDS: ${{ inputs.seeds || '4101,4102' }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
      - name: Compile and run actual contract/model tests
        run: |
          set -euo pipefail
          python -m compileall -q experiments/measured experiments/gdm41 experiments/gdm42 experiments/gdm43 experiments/gdm44
          python -m unittest experiments.measured.test_contracts experiments.measured.test_models -v 2>&1 | tee artifacts/tests.log
      - name: Install pinned Rover
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/rover-install
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          sha256sum /tmp/rover.tar.gz > artifacts/rover-archive.sha256
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Train and verify a real small smoke policy
        run: |
          set -euo pipefail
          python -m experiments.measured.run --backbone hash --smoke --output artifacts/smoke 2>&1 | tee artifacts/smoke.log
      - id: plan
        name: Resolve implemented worker matrix
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from experiments.measured.batches import all_configs
          batches = tuple(map(int, os.environ['BATCHES'].split(',')))
          rows = all_configs(batches=batches)
          seeds = [int(s) for s in os.environ['SEEDS'].split(',')]
          assert rows and seeds and len(seeds) <= 3
          models = sorted({r['backbone'] for r in rows})
          matrix = {'backbone': models}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps(matrix) + '\n')
          print(json.dumps({'configurations': len(rows), 'model_runs': len(rows) * len(seeds), 'workers': models}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-repair-preflight-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  models:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts "$HOME/.local/bin" /tmp/rover-install
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          if [ '${{ matrix.backbone }}' = neobert ]; then
            python -m pip install --no-deps xformers==0.0.32.post2
            python -m pip install einops==0.8.1
          fi
          curl -fL --retry 3 https://github.com/apollographql/rover/releases/download/v0.41.0/rover-v0.41.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/rover.tar.gz
          tar -xzf /tmp/rover.tar.gz -C /tmp/rover-install
          find /tmp/rover-install -type f -name rover -exec install -m 755 '{}' "$HOME/.local/bin/rover" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -m pip freeze > artifacts/packages.txt
      - name: Train, evaluate and verify every configured arm
        env:
          BACKBONE: ${{ matrix.backbone }}
        run: |
          set -euo pipefail
          python -m experiments.measured.run --backbone "$BACKBONE" --batches "$BATCHES" --seeds "$SEEDS" --epochs 8 --output artifacts/results 2>&1 | tee artifacts/run.log
          test -s artifacts/results/worker.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-worker-${{ github.run_id }}-${{ matrix.backbone }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 3
  verify-batch:
    needs: [preflight, models]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: measured-worker-${{ github.run_id }}-*
          path: collected
      - name: Independently verify coverage and measurements
        run: |
          set -euo pipefail
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          python -m pip install -r experiments/measured/requirements.txt
          python -m experiments.measured.collect collected --batches "$BATCHES" --seeds "$SEEDS" 2>&1 | tee collection.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-batch-report-${{ github.run_id }}
          path: |
            collected/BATCH_REPORT.json
            collection.log
          if-no-files-found: error
          retention-days: 14
